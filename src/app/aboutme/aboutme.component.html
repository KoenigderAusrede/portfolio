<div class="main">
    <div class="heroBox">
      <div class="heroBgLeft"></div>
      <div class="heroBgRight"></div>
  
      <div class="heroGrid">
        <div class="heroVertical" [ngClass]="text().hero.iam.class">
          <span>{{ text().hero.iam.text }}</span>
        </div>
        
  
        <div class="heroContent">
          <h1>{{ text().hero.name }}</h1>
          <p class="roles">
            <span *ngFor="let role of text().hero.roles" class="roleItem">{{ role }}</span>
          </p>
        </div>
      </div>
  
      <div class="heroButton">
        <button class="greenButton" (click)="scrollToContact()">{{ text().hero.cta }}</button>
      </div>
    </div>
  
    <div class="divider">
      <div style="width: 5.5rem;">
        <app-section-line position="left" color="#70E61C"></app-section-line>
      </div>
      <a href="https://github.com/KoenigderAusrede" target="_blank" rel="noopener noreferrer">
        <img class="dividerButton" src="assets/buttons/Github button.png" alt="GitHub" />
      </a>
      <img class="dividerButton" src="assets/buttons/Email button.png" (click)="scrollToContact()" alt="Mail" />
      <a href="https://www.linkedin.com/in/felix-blaser-499804154/" target="_blank" rel="noopener noreferrer">
        <img class="dividerButton" src="assets/buttons/Linkedin button.png" alt="LinkedIn" />
      </a>
    </div>
  
    <div class="scroller">
      <span class="scroll-text">{{ text().hero.scroller}}</span>
      <img src="assets/icons/arrowdown.png" alt="Scroll down" />
    </div>
  </div>
  
  <div class="main2">
    <div class="textBlock">
      <h1>{{ text().about.title }}</h1>
      <p [innerHTML]="text().about.intro">
  
      <div class="aboutBlock">
        <img src="assets/icons/bulb/bulb_white_S.png" alt="" />
        <p [innerHTML]="text().about.experience">
      </div>
  
      <div class="aboutBlock">
        <img src="assets/icons/puzzle/puzzle_white_S.png" alt="" />
        <p [innerHTML]="text().about.change">
      </div>
    </div>
  
    <div class="aboutPp">
      <img class="profileBlur" src="assets/blurrs/green_purple_shadow.png" alt="" />
      <img class="profilePicture" [ngSrc]="'assets/img/file.png'" width="300" height="400" alt="Profilbild" priority />
      <img class="curve curve-mobile" src="assets/img/curve.png" alt="Kurve Mobil" />
    </div>
  
    <img class="curve curve-desktop" src="assets/img/curve.png" alt="Kurve Desktop" />
  </div>
