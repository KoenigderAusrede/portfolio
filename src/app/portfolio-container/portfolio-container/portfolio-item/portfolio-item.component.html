<div class="portfolioItem">
  <img class="portfolioImage" [ngSrc]="project.image"  width="400" height="250" alt="{{ project.title }}" />

  <div class="portfolioButtons">
    <a *ngIf="project.github !== '#'" [href]="project.github" target="_blank" class="portfolioButton github">Github</a>
    <a *ngIf="project.url" [href]="project.url" target="_blank" class="portfolioButton liveTest">Live test</a>
  </div>

  <div class="portfolioInfo">
    <h3>{{ project.title }}</h3>
    <p class="projectDescription">
      {{ text().portfolioDescriptions[project.id] }}
    </p>
    <div class="projectTags" *ngIf="project.tags?.length">
      <span *ngFor="let tag of project.tags" class="tag">{{ tag }}</span>
    </div>  
  </div>
</div>
