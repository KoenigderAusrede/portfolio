<div class="main">
    <div style="width: 25rem;">
            <app-section-line
            text="Portfolio"
            tag="h1"
            position="left"
            color="#9747FF"
            [class]="'portfolio-heading'"
          ></app-section-line>
      </div>
    <div class="subLine">
        <p>Explore a selection of my work here - Interact with projects<br> to see my skills in action.</p>
    </div>
    <div class="container">
        <div class="grid">
            <app-portfolio-item *ngFor="let project of projects" [project]="project"></app-portfolio-item>
          </div>
    </div>
</div>
