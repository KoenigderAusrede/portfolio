<section id="portfolio">
  <div class="container">
    <div class="section-rule section-rule--line-left section-rule--bleed-left section-rule--no-pad section-rule--full-width section-rule--animate"
     appInView style="--line-color:#a36bff">
      <div class="section-rule__track" aria-hidden="true"></div>
      <h1>{{ text().portfolio.heading }}</h1>
    </div>

    <div class="subLine">
      <p [innerHTML]="text().portfolio.subheading"></p>
    </div>

    <div class="grid">
      <app-portfolio-item *ngFor="let project of projects" [project]="project"></app-portfolio-item>
    </div>
  </div>
</section>
