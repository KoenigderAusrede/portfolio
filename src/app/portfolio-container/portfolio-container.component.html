<div class="main">
    <div class="portfolioHeading">
      <app-section-line
        [text]="text().portfolio.heading"
        tag="h1"
        position="left"
        color="#9747FF"
      ></app-section-line>
    </div>
    <div class="subLine">
      <p [innerHTML]="text().portfolio.subheading"></p>
    </div>
    <div class="container">
      <div class="grid">
        <app-portfolio-item *ngFor="let project of projects" [project]="project"></app-portfolio-item>
      </div>
    </div>
  </div>
